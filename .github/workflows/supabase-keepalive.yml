# Keeps the free Supabase project behind marriage/countdown from being paused for inactivity.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read the checklist from Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://afppvbxmexxntckvbtcc.supabase.co/rest/v1/checklist_items?select=id&limit=1" \
            -H "apikey: sb_publishable_Qt6nru9Bz-H9_giCk036Kg_edrEo9ul")
          echo "Supabase responded with HTTP $code"
          # A failure here usually means the project was paused: resume it in the Supabase dashboard.
          test "$code" = "200"

      - uses: actions/checkout@v4

      # GitHub turns off scheduled workflows in public repos after 60 days without commits.
      - name: Keep this schedule switched on
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Last commit was $age_days days ago"
          if [ "$age_days" -ge 40 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep Supabase keep-alive schedule active"
            git push
          fi
