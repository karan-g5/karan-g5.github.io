<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Karan &amp; Pooja · Wedding</title>
  <meta name="description" content="Counting down to Karan and Pooja's wedding on 24 January 2027." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blush: #f9e4e8;
      --rose: #e8a9b8;
      --rose-deep: #b85c76;
      --wine: #6e2a40;
      --gold: #c9a063;
      --cream: #fffaf6;
      --ink: #4a2a35;
      --muted: #8c6a75;
      --card: rgba(255, 250, 246, 0.72);
      --line: rgba(184, 92, 118, 0.22);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      font-family: "Cormorant Garamond", Georgia, serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 20% 10%, #fde8ef 0%, transparent 55%),
        radial-gradient(ellipse at 85% 30%, #f3e1f5 0%, transparent 50%),
        radial-gradient(ellipse at 50% 100%, #fbe3d9 0%, transparent 60%),
        linear-gradient(160deg, #fff5f7 0%, #fbeaf0 45%, #f6e6f3 100%);
      background-attachment: fixed;
      overflow-x: hidden;
    }

    /* floating petals */
    .petals { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .petal {
      position: absolute; top: -40px;
      width: 14px; height: 18px;
      background: linear-gradient(135deg, #f7c5d2, #e8a9b8);
      border-radius: 80% 0 80% 0;
      opacity: 0.55;
      animation: fall linear infinite;
    }
    .petal.heart { background: none; width: auto; height: auto; color: #e8a9b8; font-size: 16px; border-radius: 0; }
    @keyframes fall {
      0%   { transform: translate3d(0, -40px, 0) rotate(0deg); }
      50%  { transform: translate3d(40px, 50vh, 0) rotate(180deg); }
      100% { transform: translate3d(-20px, 110vh, 0) rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) { .petal { display: none; } }

    main { position: relative; z-index: 1; }

    /* hero */
    .hero {
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
      padding: 48px 16px;
    }
    .eyebrow {
      letter-spacing: 0.35em; text-transform: uppercase;
      font-size: clamp(1rem, 2.6vw, 1.15rem); color: var(--muted);
      transform: translateY(-18px); /* lift above the names without shifting them */
    }
    .names {
      font-family: "Great Vibes", cursive;
      font-weight: 400;
      font-size: clamp(3.2rem, 11vw, 6.5rem);
      line-height: 1.1;
      color: var(--rose-deep);
      margin: 8px 0 4px;
      text-shadow: 0 4px 24px rgba(232, 169, 184, 0.45);
    }
    .names .amp { color: var(--gold); padding: 0 0.15em; }
    .date {
      font-size: clamp(1.35rem, 3.8vw, 1.8rem);
      font-style: italic; color: var(--wine);
    }
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 28px auto; color: var(--gold);
      width: min(320px, 80%);
    }
    .divider::before, .divider::after {
      content: ""; flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .timer {
      display: flex; justify-content: center; align-items: flex-start;
      gap: clamp(8px, 3vw, 36px);
    }
    .unit {
      display: flex; flex-direction: column; align-items: center;
      min-width: clamp(84px, 24vw, 220px);
    }
    .num {
      font-family: "Cormorant Garamond", serif;
      font-weight: 500;
      font-size: clamp(4.2rem, 17vw, 11rem);
      line-height: 1;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(180deg, var(--rose-deep) 0%, var(--wine) 100%);
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
      filter: drop-shadow(0 6px 18px rgba(184, 92, 118, 0.25));
    }
    .label {
      margin-top: 10px;
      letter-spacing: 0.3em; text-transform: uppercase;
      font-size: clamp(0.75rem, 2vw, 1rem); color: var(--muted);
    }
    .sep {
      font-size: clamp(3rem, 12vw, 8rem); line-height: 1;
      color: var(--rose); opacity: 0.6;
      animation: beat 2s ease-in-out infinite;
    }
    @keyframes beat { 0%,100% { opacity: 0.35; } 50% { opacity: 0.8; } }
    .married {
      font-family: "Great Vibes", cursive;
      font-size: clamp(2.6rem, 9vw, 5rem);
      color: var(--rose-deep);
    }
    .scroll-hint {
      margin-top: 48px; color: var(--muted); text-decoration: none;
      font-size: 0.95rem; letter-spacing: 0.15em;
      animation: bob 2.4s ease-in-out infinite;
    }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(6px); } }

    /* checklist */
    .checklist-wrap { padding: 16px 16px 72px; display: flex; justify-content: center; }
    .card {
      width: 100%; max-width: 720px;
      background: var(--card);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(184, 92, 118, 0.15);
      padding: clamp(18px, 4vw, 36px);
    }
    .card h2 {
      font-family: "Great Vibes", cursive; font-weight: 400;
      font-size: clamp(2.4rem, 7vw, 3.2rem);
      color: var(--rose-deep); text-align: center; line-height: 1.1;
    }
    .progress-text { text-align: center; color: var(--muted); font-style: italic; margin: 2px 0 10px; font-size: 1.1rem; }
    .bar { height: 6px; border-radius: 99px; background: var(--blush); overflow: hidden; margin-bottom: 18px; }
    .bar > span {
      display: block; height: 100%; width: 0;
      background: linear-gradient(90deg, var(--rose), var(--rose-deep));
      border-radius: inherit; transition: width 0.5s ease;
    }

    .add { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .add input {
      flex: 1 1 200px; min-width: 0;
      font: inherit; font-size: 1.15rem; color: var(--ink);
      padding: 10px 14px;
      border: 1px solid var(--line); border-radius: 14px;
      background: rgba(255, 255, 255, 0.85);
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .add input:focus { border-color: var(--rose); box-shadow: 0 0 0 4px rgba(232, 169, 184, 0.25); }
    .add button {
      font: inherit; font-size: 1.1rem; font-weight: 600;
      flex: none; padding: 10px 22px; border: 0; border-radius: 14px; cursor: pointer;
      color: #fff; background: linear-gradient(135deg, var(--rose), var(--rose-deep));
      box-shadow: 0 6px 18px rgba(184, 92, 118, 0.3);
      transition: transform 0.15s;
    }
    .add button:hover { transform: translateY(-1px); }
    .add button:active { transform: translateY(1px); }

    .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .chip {
      font: inherit; font-size: 1rem; cursor: pointer;
      padding: 5px 14px; border-radius: 99px;
      border: 1px solid var(--line); background: rgba(255, 255, 255, 0.7);
      color: var(--wine); transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .chip:hover { border-color: var(--rose); }
    .chip[aria-pressed="true"] {
      background: linear-gradient(135deg, var(--rose), var(--rose-deep));
      color: #fff; border-color: transparent;
    }
    .chip .count { opacity: 0.75; font-size: 0.9em; margin-left: 4px; }

    .tag, .tag-input {
      justify-self: start; max-width: 100%; text-align: left;
      font: inherit; font-size: 0.85rem; letter-spacing: 0.04em;
      padding: 1px 10px; border-radius: 99px;
      border: 1px solid rgba(201, 160, 99, 0.45);
      background: rgba(201, 160, 99, 0.1); color: #8a6a3a;
    }
    .tag { cursor: pointer; transition: background 0.2s; }
    .tag:hover { background: rgba(201, 160, 99, 0.22); }
    .tag-input { outline: none; width: 100%; }
    .tag-input:focus { box-shadow: 0 0 0 3px rgba(201, 160, 99, 0.25); }

    ul.items { list-style: none; }
    .list-head, .item {
      display: grid; grid-template-columns: 20px minmax(0, 1fr) minmax(0, 30%) 30px;
      align-items: center; column-gap: 10px;
    }
    .list-head {
      padding: 0 6px 6px; border-bottom: 1px solid var(--line);
      font-size: 0.8rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted);
    }
    .list-head span:nth-child(2) { padding-left: 38px; }
    .item {
      padding: 10px 2px;
      border-bottom: 1px solid var(--line);
      animation: appear 0.35s ease;
    }
    .item:last-child { border-bottom: 0; }
    @keyframes appear { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
    .item label { display: flex; align-items: center; gap: 12px; cursor: pointer; min-width: 0; }
    .item input[type="checkbox"] { position: absolute; opacity: 0; width: 0; height: 0; }
    .box {
      flex: none; width: 26px; height: 26px; border-radius: 50%;
      border: 1.5px solid var(--rose);
      display: grid; place-items: center;
      background: #fff; transition: background 0.25s, border-color 0.25s;
      color: transparent; font-size: 14px;
    }
    .item input:checked + .box { background: var(--rose-deep); border-color: var(--rose-deep); color: #fff; }
    .item.progress { background: linear-gradient(90deg, rgba(201, 160, 99, 0.14), rgba(201, 160, 99, 0.04)); }
    .item.progress .box { border-color: var(--gold); background: linear-gradient(90deg, var(--gold) 50%, #fff 50%); }
    .item.progress .text::after {
      content: "in progress"; display: block; font-size: 0.85rem; font-weight: 400;
      font-style: italic; color: #8a6a3a; letter-spacing: 0.02em;
    }
    .item input:focus-visible + .box { box-shadow: 0 0 0 4px rgba(232, 169, 184, 0.4); }
    .text { font-size: 1.35rem; font-weight: 600; line-height: 1.25; color: var(--ink); overflow-wrap: break-word; transition: color 0.25s; }
    .handle {
      border: 0; background: none; padding: 6px 0; font-size: 1.1rem; line-height: 1;
      color: var(--rose); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
      border-radius: 6px; letter-spacing: -2px;
    }
    .handle:hover { color: var(--rose-deep); }
    .handle:focus-visible { outline: 2px solid var(--rose); }
    .items.sorting .item { animation: none; }

    /* Phones: the item name takes the full row; its type sits just underneath. */
    @media (max-width: 560px) {
      .checklist-wrap { padding: 12px 10px 64px; }
      .list-head { display: none; }
      .item { grid-template-columns: 18px minmax(0, 1fr) 28px; row-gap: 4px; padding: 10px 0; }
      .item > :first-child { grid-row: 1 / span 2; }
      .item label { grid-column: 2; grid-row: 1; }
      .item .tag, .item .tag-input { grid-column: 2; grid-row: 2; margin-left: 38px; font-size: 0.8rem; }
      .item .del { grid-column: 3; grid-row: 1 / span 2; }
      .add input#new-type { flex-basis: 140px; }
    }
    .items.sorting, .items.sorting * { cursor: grabbing; }
    .item.dragging {
      background: rgba(255, 255, 255, 0.95); border-radius: 14px;
      box-shadow: 0 10px 30px rgba(184, 92, 118, 0.25); position: relative; z-index: 2;
    }
    .item.done .text { font-weight: 500; color: var(--muted); text-decoration: line-through; text-decoration-color: var(--rose); }
    .del {
      flex: none; border: 0; background: none; cursor: pointer;
      color: var(--muted); font-size: 1.4rem; line-height: 1; padding: 4px 8px; border-radius: 8px;
      opacity: 0.45; transition: opacity 0.2s, color 0.2s;
    }
    .item:hover .del, .del:focus-visible { opacity: 1; }
    .del:hover { color: var(--rose-deep); }
    @media (hover: none) { .del { opacity: 0.7; } }
    .sync-status { text-align: center; font-style: italic; font-size: 0.95rem; color: var(--muted); margin-top: 18px; min-height: 1.2em; }
    .sync-status[data-kind="err"] { color: var(--rose-deep); }
    .done-wrap { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 12px; }
    .done-wrap summary {
      cursor: pointer; list-style: none; padding: 6px;
      font-size: 1.15rem; color: var(--wine); display: flex; align-items: center; gap: 10px;
    }
    .done-wrap summary::-webkit-details-marker { display: none; }
    .done-wrap summary::before { content: "›"; display: inline-block; transition: transform 0.2s; color: var(--rose-deep); font-size: 1.4rem; line-height: 1; }
    .done-wrap[open] summary::before { transform: rotate(90deg); }
    .done-wrap .count { color: var(--muted); font-style: italic; }
    .empty { text-align: center; color: var(--muted); font-style: italic; padding: 16px 0; }

    .secret { border: 0; background: none; font: inherit; color: inherit; cursor: default; padding: 0 2px; }
    .pw-dialog {
      margin: auto; border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 22px;
      padding: 26px 24px 20px; width: min(340px, calc(100% - 32px));
      background: var(--cream); color: var(--ink);
      box-shadow: 0 20px 60px rgba(110, 42, 64, 0.25);
    }
    .pw-dialog::backdrop { background: rgba(110, 42, 64, 0.25); backdrop-filter: blur(4px); }
    .pw-title { font-family: "Great Vibes", cursive; font-size: 2.2rem; color: var(--rose-deep); text-align: center; line-height: 1.1; margin-bottom: 14px; }
    .pw-dialog input {
      width: 100%; font: inherit; font-size: 1.15rem; padding: 10px 14px;
      border: 1px solid var(--line); border-radius: 12px; outline: none; background: #fff; color: var(--ink);
    }
    .pw-dialog input:focus { border-color: var(--rose); box-shadow: 0 0 0 4px rgba(232, 169, 184, 0.25); }
    .pw-error { min-height: 1.3em; color: var(--rose-deep); font-style: italic; font-size: 0.95rem; margin: 6px 2px; }
    .pw-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .pw-actions button { font: inherit; font-size: 1.05rem; padding: 8px 18px; border-radius: 12px; cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--wine); }
    .pw-actions button[type="submit"] { border: 0; color: #fff; background: linear-gradient(135deg, var(--rose), var(--rose-deep)); }
    footer { text-align: center; padding: 0 16px 40px; color: var(--muted); font-style: italic; }
  </style>
</head>
<body>
  <div class="petals" aria-hidden="true"></div>

  <main>
    <section class="hero">
      <p class="eyebrow">Counting down to forever</p>
      <h1 class="names">Karan<span class="amp">&amp;</span>Pooja</h1>
      <p class="date">Sunday, 24 January 2027</p>
      <div class="divider">❦</div>

      <div id="timer" class="timer" role="timer" aria-live="off">
        <div class="unit"><span class="num" id="d">--</span><span class="label">Days</span></div>
        <span class="sep">·</span>
        <div class="unit"><span class="num" id="h">--</span><span class="label">Hours</span></div>
        <span class="sep">·</span>
        <div class="unit"><span class="num" id="m">--</span><span class="label">Minutes</span></div>
      </div>

      <a class="scroll-hint" href="#checklist">our wedding checklist ↓</a>
    </section>

    <section class="checklist-wrap" id="checklist">
      <div class="card">
        <h2>Wedding Checklist</h2>
        <p class="progress-text" id="progress-text"></p>
        <div class="bar"><span id="bar"></span></div>

        <form class="add" id="add-form" autocomplete="off">
          <input id="new-item" type="text" placeholder="Add something to the list…" maxlength="119" autocapitalize="sentences" aria-label="New checklist item" />
          <input id="new-type" type="text" list="type-list" placeholder="Type, e.g. Marriage Essentials" maxlength="60" autocapitalize="words" aria-label="Item type" />
          <button type="submit">Add</button>
        </form>
        <datalist id="type-list"></datalist>

        <div class="filters" id="filters" role="group" aria-label="Filter by type"></div>

        <div class="list-head" id="list-head"><span></span><span>Item</span><span>Type</span></div>
        <ul class="items" id="items"></ul>

        <details class="done-wrap" id="done-wrap">
          <summary>Done <span class="count" id="done-count"></span></summary>
          <ul class="items" id="done-items"></ul>
        </details>
        <p class="sync-status" id="sync-status" aria-live="polite"></p>
      </div>
    </section>

    <footer>made with love <button type="button" class="secret" id="secret" aria-label="Heart">♡</button></footer>

    <dialog class="pw-dialog" id="pw-dialog">
      <form id="pw-form">
        <p class="pw-title">Just for us ♡</p>
        <input id="pw-input" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" />
        <p class="pw-error" id="pw-error" aria-live="polite"></p>
        <div class="pw-actions">
          <button type="button" id="pw-cancel">Cancel</button>
          <button type="submit">Open</button>
        </div>
      </form>
    </dialog>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script>
    // ---------- Countdown ----------
    // Wedding day starts at midnight India time (IST, UTC+05:30).
    const WEDDING = new Date("2027-01-24T00:00:00+05:30").getTime();
    const $d = document.getElementById("d");
    const $h = document.getElementById("h");
    const $m = document.getElementById("m");
    const pad = n => String(n).padStart(2, "0");

    function tick() {
      const diff = WEDDING - Date.now();
      if (diff <= 0) {
        document.getElementById("timer").innerHTML = '<p class="married">Today we say forever ♡</p>';
        clearInterval(timerId);
        return;
      }
      const totalMin = Math.floor(diff / 60000);
      $d.textContent = Math.floor(totalMin / 1440);
      $h.textContent = pad(Math.floor((totalMin % 1440) / 60));
      $m.textContent = pad(totalMin % 60);
    }
    const timerId = setInterval(tick, 1000);
    tick();

    // ---------- Checklist (shared across devices via Supabase; cached on this device) ----------
    const SUPABASE_URL = "https://afppvbxmexxntckvbtcc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Qt6nru9Bz-H9_giCk036Kg_edrEo9ul"; // publishable key: safe in the page
    const db = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
    const STORAGE_KEY = "kp-wedding-checklist-v1";
    const ALL = "All";
    const FALLBACK_TYPE = "General";
    const DEFAULT_ITEMS = [
      ["Pooja combined saree", "Pooja Varmala Outfit"],
      ["Pooja blouse", "Pooja Varmala Outfit"],
      ["Pooja earrings", "Pooja Varmala Outfit"],
      ["Pooja sandal", "Pooja Varmala Outfit"],
      ["Pooja makeup artist", "Pooja Varmala Outfit"],
      ["Photographer", "Marriage Essentials"],
      ["Morning band", "Marriage Essentials"],
      ["Night dhol", "Marriage Essentials"]
    ];
    const DEFAULT_TYPE_BY_TEXT = Object.fromEntries(DEFAULT_ITEMS.map(([t, ty]) => [t.toLowerCase(), ty]));
    // Password-protected type: its items are hidden on screen until the password is entered.
    const PRIVATE_TYPE = "MyMoments";
    const PW_HASH = "9552e277ebcc7fa191292c6e900d94dfe6e837d8abf76a2da927d4530d2c8f69"; // SHA-256 of the password
    const PW_KEY = "kp-moments-unlocked"; // sessionStorage: unlocked until this tab is closed
    let unlocked = false;
    try { unlocked = sessionStorage.getItem(PW_KEY) === "1"; } catch (e) { /* ignore */ }
    const isPrivate = item => item.type === PRIVATE_TYPE;
    const allItems = () => unlocked ? state.items : state.items.filter(i => !isPrivate(i));

    // "In progress" is stored as an invisible marker at the start of the item's text,
    // so no extra database column is needed. fromRow/toRow translate to and from the database.
    const PROGRESS_MARK = "\u2063";
    const fromRow = r => ({
      id: r.id, type: r.type, done: r.done, created_at: r.created_at,
      text: r.text.replace(/^\u2063/, ""),
      progress: !r.done && r.text.startsWith(PROGRESS_MARK)
    });
    const toRow = i => ({
      id: i.id, type: i.type, done: i.done, created_at: i.created_at,
      text: (i.progress && !i.done ? PROGRESS_MARK : "") + i.text
    });

    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

    function load() {
      let items = null, types = [], filter = ALL, makeupMoved = false, syncedOnce = false, doneOpen = false;
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        if (Array.isArray(parsed)) {
          items = parsed; // older format: plain list of items, no types yet
        } else if (parsed && Array.isArray(parsed.items)) {
          items = parsed.items;
          if (Array.isArray(parsed.types)) types = parsed.types;
          if (typeof parsed.filter === "string") filter = parsed.filter;
          makeupMoved = parsed.makeupMoved === true;
          syncedOnce = parsed.syncedOnce === true;
          doneOpen = parsed.doneOpen === true;
        }
      } catch (e) { /* storage unavailable or corrupt: fall back to defaults */ }
      if (!items) { makeupMoved = true; items = DEFAULT_ITEMS.map(([text, type]) => ({ id: uid(), text, type, done: false })); }
      for (const it of items) {
        if (!it.type) it.type = DEFAULT_TYPE_BY_TEXT[String(it.text).toLowerCase()] || FALLBACK_TYPE;
      }
      for (const it of items) {
        if (it.type === "MyMoments") continue;
        if (!types.some(t => t.toLowerCase() === it.type.toLowerCase())) types.push(it.type);
      }
      return { items, types, filter, makeupMoved, syncedOnce, doneOpen };
    }
    function save() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
    }

    const state = load();

    // One-time fix for lists saved earlier: makeup artist belongs with Pooja's outfit.
    if (!state.makeupMoved) {
      for (const it of state.items) {
        if (String(it.text).toLowerCase() === "pooja makeup artist" && it.type === "Marriage Essentials") {
          it.type = "Pooja Varmala Outfit";
        }
      }
      state.makeupMoved = true;
    }
    save();

    const capFirst = s => s.charAt(0).toUpperCase() + s.slice(1);

    // Reuse an existing type's spelling when it matches case-insensitively; remember new ones.
    function canonicalType(raw) {
      const t = capFirst((raw || "").trim().replace(/\s+/g, " ")) || FALLBACK_TYPE;
      if (t.toLowerCase() === PRIVATE_TYPE.toLowerCase()) return PRIVATE_TYPE; // never stored publicly
      const existing = state.types.find(x => x.toLowerCase() === t.toLowerCase());
      if (existing) return existing;
      state.types.push(t);
      remote(() => db.from("checklist_types").upsert({ name: t }, { onConflict: "name", ignoreDuplicates: true }));
      return t;
    }

    const $list = document.getElementById("items");
    const $bar = document.getElementById("bar");
    const $progress = document.getElementById("progress-text");
    const $filters = document.getElementById("filters");
    const $typeList = document.getElementById("type-list");
    const $newItem = document.getElementById("new-item");
    const $newType = document.getElementById("new-type");
    const $listHead = document.getElementById("list-head");
    const $doneList = document.getElementById("done-items");
    const $doneWrap = document.getElementById("done-wrap");
    const $doneCount = document.getElementById("done-count");

    // Remember on this device whether the Done list is expanded.
    $doneWrap.open = state.doneOpen === true;
    $doneWrap.addEventListener("toggle", () => { state.doneOpen = $doneWrap.open; save(); });

    function setFilter(f) {
      state.filter = f;
      $newType.value = f === ALL ? "" : f;
      save(); render();
    }

    function chip(label, value, done, total) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip";
      b.setAttribute("aria-pressed", String(state.filter === value));
      b.textContent = label;
      const c = document.createElement("span");
      c.className = "count"; c.textContent = `${done}/${total}`;
      b.appendChild(c);
      b.addEventListener("click", () => setFilter(value));
      return b;
    }

    function editType(item, tagBtn) {
      const input = document.createElement("input");
      input.className = "tag-input"; input.type = "text";
      input.setAttribute("list", "type-list");
      input.setAttribute("aria-label", "Type for " + item.text);
      input.maxLength = 60;
      input.setAttribute("autocapitalize", "words");
      input.value = item.type;
      let finished = false;
      const finish = commit => {
        if (finished) return;
        finished = true;
        if (commit) {
          const type = canonicalType(input.value);
          if (type !== item.type) changeType(item, type);
        }
        save(); render();
      };
      input.addEventListener("keydown", e => {
        if (e.key === "Enter") { e.preventDefault(); finish(true); }
        else if (e.key === "Escape") finish(false);
      });
      input.addEventListener("blur", () => finish(true));
      tagBtn.replaceWith(input);
      input.focus(); input.select();
    }

    function changeType(item, type) {
      if (type === PRIVATE_TYPE && !unlocked) { setStatus("err", "That type isn't available"); return; }
      item.type = type;
      remote(() => db.from("checklist_items").update({ type, updated_at: new Date().toISOString() }).eq("id", item.id));
    }

    // ---------- Reordering ----------
    // Order is stored in created_at (the list is sorted by it), so no extra database column is needed.
    const ORDER_BASE = Date.UTC(2026, 0, 1);
    let dragging = false;

    function applyOrder(ids) {
      const before = state.items.map(i => i.id).join();
      // Put the reordered items back into the slots they occupied in the full list.
      const byId = Object.fromEntries(state.items.map(i => [i.id, i]));
      const slots = state.items.map((i, n) => ids.includes(i.id) ? n : -1).filter(n => n >= 0);
      slots.forEach((slot, k) => { state.items[slot] = byId[ids[k]]; });
      if (state.items.map(i => i.id).join() === before) return;
      state.items.forEach((i, n) => { i.created_at = new Date(ORDER_BASE + n * 1000).toISOString(); });
      save(); render();
      const rows = state.items.map(toRow);
      remote(() => db.from("checklist_items").upsert(rows, { onConflict: "id" }));
    }

    function startDrag(e, li, handle) {
      if (e.button !== undefined && e.button !== 0) return;
      e.preventDefault();
      handle.setPointerCapture(e.pointerId);
      dragging = true;
      li.classList.add("dragging");
      $list.classList.add("sorting");
      const onMove = ev => {
        const y = ev.clientY;
        if (y < 60) window.scrollBy(0, -12); else if (y > window.innerHeight - 60) window.scrollBy(0, 12);
        let target = null;
        for (const sib of $list.querySelectorAll(".item:not(.dragging)")) {
          const r = sib.getBoundingClientRect();
          if (y < r.top + r.height / 2) { target = sib; break; }
        }
        if (target) { if (li.nextElementSibling !== target) $list.insertBefore(li, target); }
        else if ($list.lastElementChild !== li) $list.appendChild(li);
      };
      const onUp = () => {
        handle.removeEventListener("pointermove", onMove);
        handle.removeEventListener("pointerup", onUp);
        handle.removeEventListener("pointercancel", onUp);
        li.classList.remove("dragging");
        $list.classList.remove("sorting");
        dragging = false;
        applyOrder([...$list.querySelectorAll(".item")].map(el => el.dataset.id));
      };
      handle.addEventListener("pointermove", onMove);
      handle.addEventListener("pointerup", onUp);
      handle.addEventListener("pointercancel", onUp);
    }

    // Keyboard: arrow up/down on the grip moves the item.
    function nudge(e, item) {
      if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
      e.preventDefault();
      const ids = [...$list.querySelectorAll(".item")].map(el => el.dataset.id);
      const i = ids.indexOf(item.id), j = i + (e.key === "ArrowUp" ? -1 : 1);
      if (j < 0 || j >= ids.length) return;
      [ids[i], ids[j]] = [ids[j], ids[i]];
      applyOrder(ids);
      $list.querySelector(`.item[data-id="${CSS.escape(item.id)}"] .handle`)?.focus();
    }

    function itemRow(item, sortable) {
      const li = document.createElement("li");
      li.className = "item" + (item.done ? " done" : item.progress ? " progress" : "");
      li.dataset.id = item.id;

      let grip;
      if (sortable) {
        grip = document.createElement("button");
        grip.type = "button"; grip.className = "handle"; grip.textContent = "⋮⋮";
        grip.title = "Drag to reorder";
        grip.setAttribute("aria-label", `Move ${item.text} (use arrow keys)`);
        grip.addEventListener("pointerdown", e => startDrag(e, li, grip));
        grip.addEventListener("keydown", e => nudge(e, item));
      } else {
        grip = document.createElement("span");
      }

      const label = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = item.done;
      cb.indeterminate = !item.done && !!item.progress;
      cb.title = item.done ? "Done — tap to reopen" : item.progress ? "In progress — tap to mark done" : "Tap to mark in progress";
      cb.addEventListener("change", () => {
        // Cycle: to do → in progress → done → to do.
        if (item.done) { item.done = false; item.progress = false; }
        else if (item.progress) { item.done = true; item.progress = false; }
        else { item.progress = true; }
        save(); render();
        remote(() => db.from("checklist_items").update({ done: item.done, text: toRow(item).text, updated_at: new Date().toISOString() }).eq("id", item.id));
      });
      const box = document.createElement("span");
      box.className = "box"; box.textContent = "✓";
      const text = document.createElement("span");
      text.className = "text"; text.textContent = item.text;
      label.append(cb, box, text);

      const tag = document.createElement("button");
      tag.type = "button"; tag.className = "tag";
      tag.textContent = item.type;
      tag.title = "Change type";
      tag.setAttribute("aria-label", `Type: ${item.type}. Click to change`);
      tag.addEventListener("click", () => editType(item, tag));

      const del = document.createElement("button");
      del.className = "del"; del.type = "button";
      del.setAttribute("aria-label", "Remove " + item.text);
      del.textContent = "×";
      del.addEventListener("click", () => {
        if (!confirm('Remove "' + item.text + '" from the list?')) return;
        state.items = state.items.filter(i => i.id !== item.id);
        save(); render();
        remote(() => db.from("checklist_items").delete().eq("id", item.id));
      });

      li.append(grip, label, tag, del);
      return li;
    }

    function render() {
      const items = allItems();
      // Types currently in use, in the order they were first added (MyMoments always shown once unlocked).
      const inUse = state.types.filter(t => items.some(i => i.type === t));
      if (unlocked) inUse.push(PRIVATE_TYPE);
      if (state.filter !== ALL && !inUse.includes(state.filter)) state.filter = ALL;

      // Suggestions for the type fields.
      $typeList.innerHTML = "";
      for (const t of unlocked ? [...state.types, PRIVATE_TYPE] : state.types) {
        const o = document.createElement("option");
        o.value = t; $typeList.appendChild(o);
      }

      // Filter chips.
      $filters.innerHTML = "";
      const doneOf = arr => arr.filter(i => i.done).length;
      $filters.appendChild(chip(ALL, ALL, doneOf(items), items.length));
      for (const t of inUse) {
        const ofType = items.filter(i => i.type === t);
        $filters.appendChild(chip(t, t, doneOf(ofType), ofType.length));
      }
      $filters.hidden = items.length === 0 && !unlocked;

      // Items: still to do in the main list, finished ones in the expandable "Done" list.
      const visible = state.filter === ALL ? items : items.filter(i => i.type === state.filter);
      const pending = visible.filter(i => !i.done);
      const finished = visible.filter(i => i.done);

      $list.innerHTML = "";
      if (!pending.length) {
        $list.innerHTML = visible.length
          ? '<li class="empty">Everything here is done ♡</li>'
          : '<li class="empty">Nothing here yet — add your first item above.</li>';
      }
      for (const item of pending) $list.appendChild(itemRow(item, pending.length > 1));
      $listHead.hidden = !pending.length;

      $doneList.innerHTML = "";
      for (const item of finished) $doneList.appendChild(itemRow(item, false));
      $doneCount.textContent = `(${finished.length})`;
      $doneWrap.hidden = !finished.length;

      // Progress for the current view.
      const done = doneOf(visible);
      const inProgress = visible.filter(i => !i.done && i.progress).length;
      const scope = state.filter === ALL ? "" : ` in ${state.filter}`;
      $progress.textContent = visible.length
        ? `${done} of ${visible.length} done${scope}` + (inProgress ? ` · ${inProgress} in progress` : "") + (done === visible.length ? " — all set! ♡" : "")
        : "";
      $bar.style.width = visible.length ? (done / visible.length * 100) + "%" : "0";
    }

    document.getElementById("add-form").addEventListener("submit", e => {
      e.preventDefault();
      const text = capFirst($newItem.value.trim());
      if (!text) { $newItem.focus(); return; }
      const type = canonicalType($newType.value || (state.filter !== ALL ? state.filter : ""));
      const item = { id: uid(), text, type, done: false, created_at: new Date().toISOString() };
      if (type === PRIVATE_TYPE && !unlocked) { setStatus("err", "That type isn't available"); return; }
      state.items.push(item);
      remote(() => db.from("checklist_items").insert(toRow(item)));
      // Keep the new item visible if a different type is filtered.
      if (state.filter !== ALL && state.filter !== type) state.filter = type;
      $newType.value = state.filter === ALL ? "" : state.filter;
      save(); render();
      $newItem.value = "";
      $newItem.focus();
    });

    if (state.filter !== ALL) $newType.value = state.filter;
    render();

    // ---------- Sync with Supabase ----------
    const $status = document.getElementById("sync-status");
    function setStatus(kind, msg) { $status.dataset.kind = kind; $status.textContent = msg; }

    function mergeTypes(names, items) {
      const out = [];
      for (const t of [...names, ...items.map(i => i.type)]) {
        if (t === PRIVATE_TYPE) continue;
        if (!out.some(x => x.toLowerCase() === t.toLowerCase())) out.push(t);
      }
      return out;
    }

    async function fetchRemote() {
      const [it, ty] = await Promise.all([
        db.from("checklist_items").select("id,text,type,done,created_at").order("created_at").order("id"),
        db.from("checklist_types").select("name").order("created_at")
      ]);
      if (it.error) throw it.error;
      if (ty.error) throw ty.error;
      return { items: it.data.map(fromRow), types: ty.data.map(t => t.name) };
    }

    let pulling = false, pullAgain = false;
    async function pull() {
      if (!db) { setStatus("err", "Offline — changes are saved on this device only"); return false; }
      // Don't redraw under someone who is mid-way through renaming a type.
      if (dragging || document.querySelector(".tag-input")) { schedulePull(); return true; }
      if (pulling) { pullAgain = true; return true; }
      pulling = true;
      try {
        let data = await fetchRemote();
        if (!data.items.length && !state.syncedOnce && state.items.length) {
          // First time the list goes online: upload what this device already has.
          const base = Date.now();
          const types = mergeTypes(state.types, state.items);
          let r = await db.from("checklist_types").upsert(types.map(name => ({ name })), { onConflict: "name", ignoreDuplicates: true });
          if (r.error) throw r.error;
          r = await db.from("checklist_items").upsert(
            state.items.map((i, n) => toRow({ ...i, created_at: new Date(base + n).toISOString() })),
            { onConflict: "id" });
          if (r.error) throw r.error;
          data = await fetchRemote();
        }
        state.items = data.items;
        state.types = mergeTypes(data.types, data.items);
        state.syncedOnce = true;
        save(); render();
        setStatus("ok", "Shared across your devices ✓");
        return true;
      } catch (e) {
        console.error(e);
        setStatus("err", "Can't reach the shared list right now — showing the last saved copy");
        return false;
      } finally {
        pulling = false;
        if (pullAgain) { pullAgain = false; schedulePull(); }
      }
    }

    // ---------- Hidden MyMoments lock (the ♡ in the footer) ----------
    const $pwDialog = document.getElementById("pw-dialog");
    const $pwInput = document.getElementById("pw-input");
    const $pwError = document.getElementById("pw-error");

    async function sha256(text) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
    }

    function lock() {
      unlocked = false;
      try { sessionStorage.removeItem(PW_KEY); } catch (e) { /* ignore */ }
      if (state.filter === PRIVATE_TYPE) setFilter(ALL); else render();
    }

    document.getElementById("secret").addEventListener("click", () => {
      if (unlocked) {
        if (confirm("Hide MyMoments again?")) lock();
        return;
      }
      $pwInput.value = ""; $pwError.textContent = "";
      $pwDialog.showModal();
      $pwInput.focus();
    });
    document.getElementById("pw-cancel").addEventListener("click", () => $pwDialog.close());
    document.getElementById("pw-form").addEventListener("submit", async e => {
      e.preventDefault();
      const pw = $pwInput.value;
      if (!pw) return;
      if (await sha256(pw) !== PW_HASH) {
        $pwError.textContent = "That's not it ♡";
        $pwInput.select();
        return;
      }
      unlocked = true;
      try { sessionStorage.setItem(PW_KEY, "1"); } catch (e) { /* ignore */ }
      $pwDialog.close();
      setFilter(PRIVATE_TYPE);
    });

    let pullTimer;
    function schedulePull() { clearTimeout(pullTimer); pullTimer = setTimeout(pull, 300); }

    // Send one change to Supabase; if it fails, reload the shared list so the page shows the truth.
    async function remote(op) {
      if (!db) return;
      try {
        const { error } = await op();
        if (error) throw error;
      } catch (e) {
        console.error(e);
        await pull();
        setStatus("err", "Couldn't save that change — please check your connection and try again");
      }
    }

    if (db) {
      db.channel("wedding-checklist")
        .on("postgres_changes", { event: "*", schema: "public", table: "checklist_items" }, schedulePull)
        .on("postgres_changes", { event: "*", schema: "public", table: "checklist_types" }, schedulePull)
        .subscribe();
      // Phones pause live updates in the background; catch up when the page is shown again.
      document.addEventListener("visibilitychange", () => { if (!document.hidden) schedulePull(); });
    }
    pull();

    // ---------- Petals ----------
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
      const wrap = document.querySelector(".petals");
      const count = window.innerWidth < 600 ? 14 : 26;
      for (let i = 0; i < count; i++) {
        const p = document.createElement("span");
        const heart = Math.random() < 0.25;
        p.className = "petal" + (heart ? " heart" : "");
        if (heart) p.textContent = "♡";
        p.style.left = Math.random() * 100 + "vw";
        p.style.animationDuration = 10 + Math.random() * 14 + "s";
        p.style.animationDelay = -Math.random() * 20 + "s";
        const s = 0.6 + Math.random() * 0.8;
        p.style.scale = s;
        wrap.appendChild(p);
      }
    }
  </script>
</body>
</html>
